services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=meetups'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5455:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U myuser -d meetups' ]
      interval: 2s
      timeout: 5s
      retries: 15
